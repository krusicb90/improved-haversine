name: Compute factors

# Builds a routing engine from the OpenStreetMap extract of one region, samples
# trips on it, and publishes the factor table and its evaluation on the branch
# computed/<region>. Nothing is written to main.
#
# Start it from the Actions tab, or push a branch named compute/<region>.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id from pipeline/regions.json
        required: true
        default: us-ct
  push:
    branches:
      - "compute/**"

permissions:
  contents: write

concurrency:
  group: compute-${{ github.ref }}
  cancel-in-progress: true

env:
  OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend:v5.27.1

jobs:
  compute:
    name: Compute
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the region
        id: region
        env:
          REGION_INPUT: ${{ inputs.region }}
        run: |
          region="${REGION_INPUT:-${GITHUB_REF_NAME#compute/}}"
          python - "$region" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          region = json.load(open("pipeline/regions.json"))[sys.argv[1]]
          west, south, east, north = region["bbox"]
          print(f"id={sys.argv[1]}")
          print(f"geofabrik={region['geofabrik']}")
          print(f"centre={(west + east) / 2:.4f},{(south + north) / 2:.4f}")
          PY

      - name: Download the OpenStreetMap extract
        id: extract
        env:
          GEOFABRIK: ${{ steps.region.outputs.geofabrik }}
        run: |
          mkdir -p work
          curl -fsSL --retry 3 -D work/headers.txt -o work/region.osm.pbf \
            "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf"
          date="$(grep -i '^last-modified:' work/headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          ls -lh work/region.osm.pbf

      - name: Build the routing graph
        run: |
          osrm() { docker run --rm -v "$PWD/work:/data" "$OSRM_IMAGE" "$@"; }
          osrm osrm-extract -p /opt/car.lua /data/region.osm.pbf
          osrm osrm-partition /data/region.osrm
          osrm osrm-customize /data/region.osrm

      - name: Start the routing engine
        env:
          CENTRE: ${{ steps.region.outputs.centre }}
        run: |
          docker run -d --name osrm -p 5000:5000 -v "$PWD/work:/data" "$OSRM_IMAGE" \
            osrm-routed --algorithm mld --max-table-size 1000 /data/region.osrm
          for attempt in $(seq 1 30); do
            if curl -fs "http://localhost:5000/nearest/v1/driving/${CENTRE}" > /dev/null; then
              echo "routing engine is up"
              exit 0
            fi
            sleep 2
          done
          docker logs osrm
          exit 1

      - name: Compute and evaluate the factors
        env:
          REGION: ${{ steps.region.outputs.id }}
          EXTRACT_DATE: ${{ steps.extract.outputs.date }}
        run: |
          pip install -e . pytest
          python -m pipeline.run --region "$REGION" --osrm-url http://localhost:5000 --extract-date "$EXTRACT_DATE"

      - name: Check the new table with the test suite
        run: pytest -q

      - name: Publish the result on a branch
        env:
          REGION: ${{ steps.region.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "computed/${REGION}"
          git add src/improved_haversine/data evaluation
          git commit -m "Compute factors for ${REGION}"
          git push --force origin "computed/${REGION}"
