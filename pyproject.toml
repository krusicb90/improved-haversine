[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "improved-haversine"
version = "0.1.0"
description = "Road distance estimates from coordinates alone: regional correction factors for the Haversine formula, computed from OpenStreetMap."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bruno Krušić" }]
keywords = ["haversine", "distance", "geospatial", "openstreetmap", "circuity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.urls]
Repository = "https://github.com/krusicb90/improved-haversine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
improved_haversine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101", # asserts are how pytest works
  "S311", # random is used for sampling, not for security
]
